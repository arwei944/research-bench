<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bench · 设计选择</title>
<style>
  :root, [data-theme="dark"] {
    --bg:#0b0d12; --panel:#12151d; --elev:#181c26; --line:#232936; --line2:#333c4d;
    --fg:#e8ecf4; --fg2:#a2adc0; --fg3:#697586; --ac:#5b93f8; --ac2:#1e3559;
    --ok:#3ddc97; --warn:#fbbf24; --err:#fb7185;
    --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  [data-theme="light"] {
    --bg:#f6f7f9; --panel:#fff; --elev:#f0f2f5; --line:#e2e6ec; --line2:#c8cfda;
    --fg:#161b22; --fg2:#4c5866; --fg3:#7b8794; --ac:#2563eb; --ac2:#dbeafe;
    --ok:#059669; --warn:#b45309; --err:#dc2626;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  button{font:inherit;color:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}

  .wrap{max-width:1560px;margin:0 auto;padding:0 22px 70px}

  header.top{
    position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    margin:0 -22px;padding:14px 22px;
  }
  .hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:700}
  .sub{font-size:12px;color:var(--fg3)}
  .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{background:var(--ac);color:#fff;border:none;border-radius:8px;padding:7px 14px;
    cursor:pointer;font-size:12.5px;font-weight:600}
  .btn.ghost{background:var(--elev);border:1px solid var(--line);color:var(--fg2)}
  .btn:disabled{opacity:.5;cursor:default}

  .intro{max-width:780px;margin:22px 0 6px;font-size:13px;color:var(--fg2);line-height:1.75}
  .intro b{color:var(--fg)}

  /* ---------- 卡片网格 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:18px;margin-top:22px}
  @media(max-width:920px){.grid{grid-template-columns:1fr}}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;transition:border-color .14s, box-shadow .14s;
  }
  .card:hover{border-color:var(--line2);box-shadow:0 8px 28px rgba(0,0,0,.22)}
  .card.on{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 32%,transparent)}

  .card-head{padding:14px 16px 11px;border-bottom:1px solid var(--line)}
  .card-title{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .card-title .nm{font-size:14.5px;font-weight:700}
  .card-title .badge{
    font-size:10px;padding:1px 7px;border-radius:5px;background:var(--elev);
    border:1px solid var(--line);color:var(--fg3);font-family:var(--mono);
  }
  .card-title .badge.on{color:var(--ac);border-color:var(--ac)}
  .card-tag{font-size:11.5px;color:var(--fg3);margin-bottom:9px}
  .ref{font-size:11px;line-height:1.6;color:var(--fg2)}
  .ref .k{color:var(--fg3);font-weight:600}
  .ref .avoid{color:var(--fg3)}

  /* ---------- 预览画布：真实排版，不是色块 ---------- */
  .preview{
    height:300px;overflow:hidden;position:relative;
    border-bottom:1px solid var(--line);
  }
  .preview .inner{position:absolute;inset:0;display:flex;font-size:10px}

  /* 通用的「微型 UI」元素 —— 用 c- 前缀避免污染 */
  .c-sb{flex:none;background:var(--p-panel);border-right:1px solid var(--p-line);
    display:flex;flex-direction:column;padding:8px 6px;gap:5px}
  .c-sb .it{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:var(--p-radius);
    color:var(--p-fg2);white-space:nowrap;overflow:hidden;font-size:9.5px}
  .c-sb .it.on{background:var(--p-ac2);color:var(--p-ac);font-weight:600}
  .c-sb .dot{width:12px;height:12px;border-radius:3px;background:var(--p-elev);flex:none;
    display:grid;place-items:center;font-size:8px}
  .c-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--p-bg)}
  .c-top{flex:none;height:var(--p-headerH);display:flex;align-items:center;gap:7px;
    padding:0 10px;border-bottom:1px solid var(--p-line);background:var(--p-panel);font-size:9.5px}
  .c-top .t{font-weight:700;font-size:10px;color:var(--p-fg)}
  .c-top .tab{padding:3px 8px;border-radius:var(--p-radius);color:var(--p-fg2);font-size:9px}
  .c-top .tab.on{background:var(--p-elev);color:var(--p-fg);font-weight:600}
  .c-body{flex:1;overflow:hidden;padding:10px}
  .c-card{background:var(--p-panel);border:1px solid var(--p-line);border-radius:var(--p-radiusLg);
    padding:9px 11px;margin-bottom:7px;box-shadow:var(--p-shadow)}
  .c-card .h{font-size:9.5px;font-weight:700;color:var(--p-fg);margin-bottom:4px}
  .c-card .l{font-size:9px;color:var(--p-fg3);line-height:1.55}
  .c-card .row{display:flex;gap:5px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .c-pill{font-size:8px;padding:1px 6px;border-radius:99px;background:var(--p-elev);
    border:1px solid var(--p-line);color:var(--p-fg2)}
  .c-pill.ac{background:var(--p-ac2);border-color:var(--p-ac);color:var(--p-ac);font-weight:600}
  .c-input{background:var(--p-bg);border:1px solid var(--p-line);border-radius:var(--p-radius);
    padding:5px 8px;color:var(--p-fg3);font-size:9px;flex:1}
  .c-btn{background:var(--p-ac);color:#fff;border-radius:var(--p-radius);padding:4px 9px;
    font-size:8.5px;font-weight:600;white-space:nowrap}
  .c-code{font-family:var(--p-mono);font-size:8.5px;color:var(--p-fg2);line-height:1.6;
    background:var(--p-elev);border-radius:var(--p-radius);padding:6px 8px;overflow:hidden;
    border-left:2px solid var(--p-ac)}
  .c-kv{display:flex;justify-content:space-between;font-size:8.5px;padding:2px 0;
    border-bottom:1px dashed var(--p-line);color:var(--p-fg2)}
  .c-kv .v{font-family:var(--p-mono);color:var(--p-fg)}

  /* layout 专属 */
  .lv-toptabs .c-sb{display:none}
  .lv-command .c-sb{display:none}
  .lv-command .c-body{display:grid;place-items:start center;padding-top:22px}
  .lv-centered .c-sb{display:none}
  .lv-centered .c-body{padding:16px 34px}
  .lv-dashboard .c-body{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
  .lv-dashboard .c-card{margin:0}
  .lv-split .c-body{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
  .lv-split .c-card{margin:0}
  .lv-rail .c-body{padding:8px 12px}
  .lv-narrow .c-sb{width:44px}
  .lv-narrow .c-sb .it span.lbl{display:none}
  .lv-left .c-sb{width:118px}

  .card-foot{padding:11px 16px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line)}
  .card-foot .sp{flex:1}
  .tokline{font-size:10px;color:var(--fg3);font-family:var(--mono);display:flex;gap:5px;align-items:center}
  .sw{width:11px;height:11px;border-radius:3px;border:1px solid rgba(255,255,255,.14)}

  .flash{font-size:12px;padding:9px 12px;border-radius:8px;margin-top:14px}
  .flash.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);
    border:1px solid color-mix(in srgb,var(--ok) 34%,transparent)}

  /* ---------- 模式对比区 ---------- */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  @media(max-width:820px){.modes{grid-template-columns:1fr}}
  .mpanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}
  .mpanel h3{margin:0 0 4px;font-size:13px;display:flex;align-items:center;gap:8px}
  .mpanel .desc{font-size:11.5px;color:var(--fg3);margin-bottom:11px;line-height:1.6}
  .mblock{border-left:2px solid var(--line2);padding:6px 0 6px 10px;margin-bottom:9px}
  .mblock .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--fg3);font-weight:700;margin-bottom:2px}
  .mblock .v{font-size:11.5px;color:var(--fg2);line-height:1.65;white-space:pre-wrap;
    font-family:var(--mono)}
  .mpanel.nov .mblock{border-left-color:var(--ok)}
  .mpanel.exp .mblock{border-left-color:var(--ac)}

  .seg{display:inline-flex;background:var(--elev);border:1px solid var(--line);
    border-radius:8px;padding:2px;gap:2px}
  .seg button{background:none;border:none;padding:4px 11px;border-radius:6px;
    font-size:11.5px;color:var(--fg3);cursor:pointer}
  .seg button.on{background:var(--panel);color:var(--fg);font-weight:600;
    box-shadow:0 1px 3px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="hrow">
      <h1>设计选择</h1>
      <span class="sub">10 款参考真实商业产品的外壳方案</span>
      <div class="actions">
        <div class="seg" id="mode-seg">
          <button data-m="novice">小白模式</button>
          <button data-m="expert">专家模式</button>
        </div>
        <button class="btn ghost" id="theme-btn">◐</button>
        <button class="btn ghost" id="back-btn">返回工作台</button>
      </div>
    </div>
  </header>

  <p class="intro">
    每款都标注了<b>借鉴哪个商业产品</b>、<b>借鉴什么</b>、<b>刻意不借鉴什么</b>。
    预览区是用真实 HTML 排的微缩界面（不是色块），能看出布局差异。
    选中一款后点「应用」，整个工作台的外壳会立刻换成那套 token。
  </p>

  <div id="flash"></div>

  <!-- 模式对比 -->
  <h2 style="font-size:13px;margin:30px 0 4px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3)">
    模式对比 · 同一份内容的两种呈现
  </h2>
  <p style="font-size:12px;color:var(--fg3);margin:0 0 4px">
    这是「基础模块」的核心：同一份数据，按使用者水平决定解释深度与参数可见性。
  </p>
  <div class="modes">
    <div class="mpanel nov">
      <h3>🌱 小白模式</h3>
      <div class="desc">术语带解释 · 出错给「怎么修」 · 高级参数藏起来</div>
      <div id="nov-body"></div>
    </div>
    <div class="mpanel exp">
      <h3>⚡ 专家模式</h3>
      <div class="desc">只给术语 · 完整堆栈 · 全部参数与默认值</div>
      <div id="exp-body"></div>
    </div>
  </div>

  <h2 style="font-size:13px;margin:34px 0 0;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3)">
    10 款方案
  </h2>
  <div class="grid" id="grid"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const api = async (p, o = {}) => {
  const r = await fetch(p, { headers: { "Content-Type": "application/json" }, ...o });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
};

// ===========================================================================
// 预览渲染：用真实 HTML 排出微缩界面
// ===========================================================================
function tokensToVars(t) {
  const map = {
    "--p-bg": t.bg, "--p-panel": t.panel, "--p-elev": t.elev,
    "--p-line": t.line, "--p-line2": t.line2,
    "--p-fg": t.fg, "--p-fg2": t.fg2, "--p-fg3": t.fg3,
    "--p-ac": t.ac, "--p-ac2": t.ac2, "--p-ok": t.ok,
    "--p-warn": t.warn, "--p-err": t.err,
    "--p-radius": t.radius, "--p-radiusLg": t.radiusLg,
    "--p-mono": t.fontMono, "--p-headerH": t.headerH,
    "--p-shadow": t.shadow,
  };
  return Object.entries(map).map(([k, v]) => `${k}:${v}`).join(";");
}

function layoutClass(layout) {
  return {
    "sidebar-narrow": "lv-narrow",
    "sidebar-left": "lv-left",
    "top-tabs": "lv-toptabs",
    command: "lv-command",
    centered: "lv-centered",
    dashboard: "lv-dashboard",
    split: "lv-split",
    rail: "lv-rail",
  }[layout] ?? "lv-narrow";
}

function previewHtml(d) {
  const t = d.tokens;
  const lc = layoutClass(d.layout);
  const vars = tokensToVars(t);

  // 侧栏
  const sb = `
    <div class="c-sb">
      <div class="it on"><span class="dot">🔬</span><span class="lbl">研究</span></div>
      <div class="it"><span class="dot">🎓</span><span class="lbl">学习</span></div>
      <div class="it"><span class="dot">＋</span><span class="lbl">新建</span></div>
      <div style="flex:1"></div>
      <div class="it"><span class="dot">◐</span><span class="lbl">主题</span></div>
    </div>`;

  // 主区内容（按布局不同组合）
  const cardA = `
    <div class="c-card">
      <div class="h">检索</div>
      <div class="l">14 通道 · 平均 2.3s</div>
      <div class="row"><div class="c-input">AI agent reliability</div><div class="c-btn">运行</div></div>
    </div>`;

  const cardB = `
    <div class="c-card">
      <div class="h">核验</div>
      <div class="l">arXiv:2605.12673 ✅</div>
      <div class="row"><span class="c-pill ac">已核验</span><span class="c-pill">6/6</span></div>
    </div>`;

  const cardC = `
    <div class="c-card">
      <div class="h">报告</div>
      <div class="c-code">## 结论速览
1. 差距是结构性的 [1][2]
2. 失败模式被低估 [1]</div>
    </div>`;

  const rows = `
    <div class="c-kv"><span>today</span><span class="v">12</span></div>
    <div class="c-kv"><span>fresh</span><span class="v">25</span></div>
    <div class="c-kv"><span>EF</span><span class="v">2.39</span></div>`;

  let body;
  switch (d.layout) {
    case "dashboard":
      body = `<div class="c-card"><div class="h">通道</div>${rows}</div>
              <div class="c-card"><div class="h">复习</div>${rows}</div>
              ${cardA}${cardB}`;
      break;
    case "split":
      body = `${cardA}${cardC}`;
      break;
    case "centered":
      body = `<div class="c-card" style="max-width:260px;margin:0 auto">${"<div class=\"h\">今日复习</div><div class=\"l\">λ 演算的三个语法成分是什么？</div><div class=\"row\"><span class=\"c-pill\">显示答案</span></div>"}</div>
              <div style="max-width:260px;margin:7px auto 0" class="c-card">${"<div class=\"l\">结论：差距是结构性的 [1][2]</div><div class=\"row\"><span class=\"c-pill ac\">[1]</span><span class=\"c-pill ac\">[2]</span></div>"}</div>`;
      break;
    case "command":
      body = `<div class="c-card" style="width:280px;box-shadow:var(--p-shadow)">
                <div class="row" style="margin:0"><div class="c-input">⌘K 输入命令…</div></div>
                <div style="margin-top:6px">
                  <div class="c-kv"><span>🔬 打开研究</span><span class="v">↵</span></div>
                  <div class="c-kv"><span>🎓 打开学习</span><span class="v">↵</span></div>
                  <div class="c-kv"><span>◐ 切换主题</span><span class="v">⌘T</span></div>
                </div>
              </div>`;
      break;
    case "rail":
      body = `${cardA}${cardB}${cardC}`;
      break;
    default:
      body = `${cardA}${cardB}${cardC}`;
  }

  const tabs = d.layout === "top-tabs"
    ? `<div class="c-top"><span class="t">bench</span>
         <span class="tab on">研究</span><span class="tab">学习</span><span class="tab">新建</span>
         <span style="margin-left:auto" class="c-pill">◐</span></div>`
    : `<div class="c-top"><span class="t">${esc(d.name)}</span>
         <span class="tab on">研究</span><span class="tab">学习</span>
         <span style="margin-left:auto" class="c-pill">小白</span></div>`;

  return `
    <div class="preview" style="${vars}">
      <div class="inner ${lc}" data-preview-theme="${t.theme}" style="background:var(--p-bg);color:var(--p-fg);font-family:${t.font}">
        ${d.layout === "raycast" || d.layout === "command" ? "" : sb}
        <div class="c-main">${tabs}<div class="c-body">${body}</div></div>
      </div>
    </div>`;
}

// ===========================================================================
// 渲染卡片
// ===========================================================================
const state = { designs: [], current: null, mode: "novice" };

function render(list, current) {
  state.designs = list;
  state.current = current;
  const g = $("grid");
  g.innerHTML = list.map((d) => `
    <div class="card ${d.id === current ? "on" : ""}" data-id="${d.id}">
      <div class="card-head">
        <div class="card-title">
          <span class="nm">${esc(d.name)}</span>
          <span class="badge ${d.id === current ? "on" : ""}">${esc(d.layout)} · ${esc(d.density)}</span>
          ${d.id === current ? '<span class="badge on">当前</span>' : ""}
        </div>
        <div class="card-tag">${esc(d.tagline)}</div>
        <div class="ref">
          <span class="k">借鉴</span> ${esc(d.ref)} —— ${esc(d.borrow)}<br>
          <span class="k avoid">不借鉴</span> <span class="avoid">${esc(d.avoid)}</span>
        </div>
      </div>
      ${previewHtml(d)}
      <div class="card-foot">
        <div class="tokline">
          <span class="sw" style="background:${d.tokens.bg}"></span>
          <span class="sw" style="background:${d.tokens.panel}"></span>
          <span class="sw" style="background:${d.tokens.ac}"></span>
          <span class="sw" style="background:${d.tokens.fg}"></span>
          <span style="margin-left:5px">${d.tokens.theme === "light" ? "浅色底" : "深色底"} · r=${d.tokens.radius}</span>
        </div>
        <div class="sp"></div>
        <button class="btn ${d.id === current ? "" : "ghost"}" data-apply="${d.id}"
          ${d.id === current ? "disabled" : ""}>${d.id === current ? "已应用" : "应用"}</button>
      </div>
    </div>`).join("");

  g.querySelectorAll("[data-apply]").forEach((b) => {
    b.onclick = async () => {
      try {
        await api("/api/_platform/design", { method: "POST", body: JSON.stringify({ id: b.dataset.apply }) });
        const d = await api("/api/_platform/designs");
        render(d.designs, d.current);
        flash("已应用「" + (d.designs.find((x) => x.id === d.current)?.name ?? d.current) + "」。返回工作台即可看到新外壳。");
      } catch (e) {
        flash("应用失败：" + e.message, true);
      }
    };
  });
}

function flash(msg, isErr) {
  $("flash").innerHTML = `<div class="flash ${isErr ? "err" : "ok"}">${esc(msg)}</div>`;
  setTimeout(() => { $("flash").innerHTML = ""; }, 6000);
}

// ===========================================================================
// 模式对比
// ===========================================================================
async function loadPreview() {
  try {
    const p = await api("/api/_platform/mode/preview?sample=lambda");
    const mk = (side) => p[side].blocks.map((b) => `
      <div class="mblock"><div class="k">${esc(b.k)}</div><div class="v">${esc(b.v)}</div></div>`).join("");
    $("nov-body").innerHTML = mk("novice");
    $("exp-body").innerHTML = mk("expert");
  } catch (e) {
    $("nov-body").innerHTML = `<div class="flash err">${esc(e.message)}</div>`;
  }
}

async function loadMode() {
  try {
    const d = await api("/api/_platform/mode");
    state.mode = d.mode;
    document.querySelectorAll("#mode-seg button").forEach((b) =>
      b.classList.toggle("on", b.dataset.m === d.mode));
  } catch {}
}

$("mode-seg").onclick = async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  await api("/api/_platform/mode", { method: "POST", body: JSON.stringify({ mode: b.dataset.m }) });
  await loadMode();
  flash("已切换到「" + (b.dataset.m === "expert" ? "专家模式" : "小白模式") + "」");
};

// ===========================================================================
// 主题 + 启动
// ===========================================================================
$("theme-btn").onclick = async () => {
  const cur = document.documentElement.dataset.theme;
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { await api("/api/_platform/theme", { method: "POST", body: JSON.stringify({ mode: next }) }); } catch {}
};

$("back-btn").onclick = () => { location.href = "/"; };

(async () => {
  try {
    const t = await api("/api/_platform/theme");
    document.documentElement.dataset.theme = t.mode === "light" ? "light" : "dark";
  } catch {}
  await loadMode();
  await loadPreview();
  try {
    const d = await api("/api/_platform/designs");
    render(d.designs, d.current);
  } catch (e) {
    $("grid").innerHTML = `<div class="flash err">${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
